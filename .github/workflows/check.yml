name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check the three modules
        run: npm run check
      - name: Validate the manifests and locale dictionaries
        run: |
          for f in package.json locale/en.json locale/zh.json; do
            node -e "JSON.parse(require('node:fs').readFileSync('$f', 'utf8'))" || exit 1
            echo "ok $f"
          done
      - name: Validate the icon is an SVG
        run: head -c 5 icon.svg | grep -q '<svg' && echo "ok icon.svg"
